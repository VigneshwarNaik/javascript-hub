<!DOCTYPE html>
<html>
<body>

<!-- 
Inline Script:
JavaScript code written directly inside an HTML tag
using event attributes like onclick, onmouseover, onchange etc.

onclick     = runs when user clicks element
onmouseover = runs when mouse touches element
onchange    = runs when input/select value changes
-->

<!-- onclick example -->
<button onclick="alert('Button Clicked')">
Click Me
</button>

<br><br>

<!-- onmouseover example -->
<p onmouseover="alert('Mouse Entered Text')">
Move Mouse Here
</p>

<br>

<!-- onchange example -->
<select onchange="alert('Value Changed')">
    <option>Select</option>
    <option>Java</option>
    <option>JavaScript</option>
</select>

</body>
</html>
